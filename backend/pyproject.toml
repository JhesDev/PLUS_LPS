[project]
name = "plus-lps-backend"
version = "0.1.0"
description = "API y procesos de ingesta/sincronizacion de PLUS_LPS"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
